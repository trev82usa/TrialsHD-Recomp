# Trials HD fixes on top of ReXGlue's automatic analysis.

# The game's setjmp/longjmp (MSVC CRT; used e.g. by libpng error handling). Recompiled code must
# redirect these to native implementations; running them as ordinary guest code returns to the
# wrong place with clobbered registers (seen on hardware as a null r31 in sub_8232B608).
setjmp_address = 0x822FA320
longjmp_address = 0x822FA000

# Speed: keep these PowerPC registers in C++ locals (CPU registers) instead of the shared context
# struct, so the compiler can optimise them. Volatile/argument registers only; the non-volatile and
# reserved ones stay in the context because setjmp/longjmp and thread switches rely on them.
# NOT non_argument_as_local: this game passes values between functions in r12 (the stack probe at
# 0x822FB134 takes the size in r12; exception funclets get the frame pointer in r12). Making r12 a
# local zeroes it and the game hangs on a black screen at startup.
ctr_as_local = true
xer_as_local = true
cr_as_local = true
skip_msr = true

[functions]
# C++ "this-adjust" thunk (addi r3,r3,8; b ...) that another thunk jumps into
0x821C3170 = { name = "thunk_adjust_this_821C3170", size = 8 }
# Function starts reached only by tail calls
0x8221C0F8 = { name = "sub_8221C0F8" }
0x821DD448 = { name = "sub_821DD448" }

