0x821C32F0 = { name = "thunk_adjust_this_821C32F0", size = 8 }
# Function starts reached only by tail calls
0x8221C6F0 = { name = "sub_8221C6F0" }
0x821DD8E8 = { name = "sub_821DD8E8" }

